User:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the user (MD5 hash)

    username:
      type: string
      nullable: true
      description: Unique username for the user

    email:
      type: string
      nullable: true
      description: Email address of the user
      format: email

    phoneNumber:
      type: string
      nullable: true
      description: Phone number of the user
      pattern: ^\+?\d{1,15}$

    role:
      type: string
      description: User role
      enum: [admin, user, moderator]

    isActive:
      type: boolean
      nullable: true
      description: Whether the user account is active

    emailVerified:
      type: boolean
      nullable: true
      description: Whether the user has verified email

    lastLoginAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp of the user's last login

    failedLoginAttempts:
      type: integer
      nullable: true
      description: Number of failed login attempts

    lockoutExpiresAt:
      type: string
      format: date-time
      nullable: true
      description: Account lockout expiration timestamp

    accountLockedUntil:
      type: string
      format: date-time
      nullable: true
      description: When the user account will be unlocked

    externalAuthProvider:
      type: string
      nullable: true
      description: External auth provider (google, facebook)

    externalAuthId:
      type: string
      nullable: true
      description: Provider user ID

    referralCode:
      type: string
      nullable: true
      description: User’s referral code

    referredBy:
      type: string
      nullable: true
      description: Who referred the user

    isVerified:
      type: boolean
      nullable: true
      description: If account is verified

    accountVerificationStatus:
      type: string
      nullable: true
      description: Verification state (pending, verified, rejected)

    loginMethod:
      type: string
      nullable: true
      description: Login method used (email, google)

    accountType:
      type: string
      enum: [personal, business]
      description: Account category

    profile:
      $ref: "#/components/schemas/UserProfile"

    settings:
      $ref: "#/components/schemas/UserSettings"

    createdAt:
      type: string
      format: date-time
      description: Account creation timestamp

    updatedAt:
      type: string
      format: date-time
      description: Account update timestamp

    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: Soft delete timestamp
